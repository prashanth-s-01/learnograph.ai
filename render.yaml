## Render Blueprint — deploys Postgres + backend + frontend in one click.
## Docs: https://render.com/docs/blueprint-spec

databases:
  - name: learnograph-db
    databaseName: learnograph
    user: learnograph
    plan: free

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  - type: web
    name: learnograph-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learnograph-db
          property: connectionString
      # ── LLM (Claude Sonnet 5 via TokenRouter) ──────────────────────────────
      - key: LLM_API_KEY
        sync: false          # paste your TokenRouter key in the Render dashboard
      - key: LLM_BASE_URL
        value: https://api.tokenrouter.com/v1
      - key: LLM_MODEL
        value: anthropic/claude-sonnet-5
      # ── mem0 ───────────────────────────────────────────────────────────────
      - key: MEM0_API_KEY
        sync: false
      - key: MEM0_USER_ID
        value: user_001
      # ── Rtrvr.ai ───────────────────────────────────────────────────────────
      - key: RTRVR_API_KEY
        sync: false
      # ── RocketRide (leave blank to use in-process asyncio queues) ──────────
      - key: ROCKETRIDE_API_KEY
        value: ""

  # ── Next.js frontend ────────────────────────────────────────────────────────
  - type: web
    name: learnograph-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: BACKEND_URL
        fromService:
          name: learnograph-backend
          type: web
          property: host        # gives the bare hostname; next.config.mjs prepends https://
      # NEXT_PUBLIC_WS_URL must be set manually after the backend is deployed:
      # value: wss://learnograph-backend.onrender.com/ws
      - key: NEXT_PUBLIC_WS_URL
        sync: false
      - key: NEXT_PUBLIC_ELEVENLABS_API_KEY
        sync: false
      - key: NEXT_PUBLIC_ELEVENLABS_VOICE_ID
        sync: false
